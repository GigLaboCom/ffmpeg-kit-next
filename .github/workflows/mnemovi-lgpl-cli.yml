name: MnemoVi LGPL ffmpeg/ffprobe CLI (macOS)

# Builds standalone LGPL-3.0 ffmpeg + ffprobe CLI for MnemoVi, BOTH macOS arches
# (arm64 + x86_64), each as its own job. Free on public repos: standard macos-15
# runners, no minutes billed. GPL is never built (no --enable-gpl; --full
# excludes x264/x265/xvid/vidstab/rubberband). x86_64 is CROSS-compiled on the
# arm64 runner, so its verify step installs Rosetta to run the binary.
# The Releases page these produce is the LGPL source-availability offer.

on:
  workflow_dispatch: {}
  push:
    tags:
      - "mnemovi-cli-v*"      # e.g. mnemovi-cli-v8.1.0 -> a published Release

permissions:
  contents: write             # attach binaries to a Release on tag

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: macos-15         # Apple silicon runner (arm64 host)
    timeout-minutes: 350      # full non-GPL lib stack + ffmpeg from source
    strategy:
      fail-fast: false        # one arch failing must not kill the other
      matrix:
        include:
          - arch: aarch64
            disable: --disable-x86-64
            lipo: arm64
          - arch: x86_64
            disable: --disable-arm64
            lipo: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # kit-next derives its version from git describe

      - name: Select Xcode 26 (kit-next's xcode26 profile requires it)
        run: |
          set -euo pipefail
          echo "Installed Xcodes:"; ls -d /Applications/Xcode*.app 2>/dev/null || true
          pick=""; pickv=""
          for d in /Applications/Xcode_26*.app /Applications/Xcode-26*.app /Applications/Xcode*.app; do
            [ -d "$d" ] || continue
            v="$("$d/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | awk 'NR==1{print $2}')" || continue
            case "$v" in ''|*[!0-9.]*) continue;; esac
            if [ "${v%%.*}" -ge 26 ] 2>/dev/null; then pick="$d"; pickv="$v"; break; fi
          done
          if [ -z "$pick" ]; then
            echo "::error::No Xcode >= 26 on this runner (use a macos image that ships Xcode 26)."; exit 1
          fi
          echo "Using $pick (Xcode $pickv)"
          sudo xcode-select -s "$pick/Contents/Developer"
          if [ "$pick" != "/Applications/Xcode.app" ]; then
            sudo rm -rf /Applications/Xcode.app
            sudo ln -s "$pick" /Applications/Xcode.app
          fi
          /Applications/Xcode.app/Contents/Developer/usr/bin/xcodebuild -version

      - name: Install Rosetta (to run the cross-compiled x86_64 binary in verify)
        if: matrix.arch == 'x86_64'
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Build LGPL ffmpeg/ffprobe CLI (--full, no GPL, ${{ matrix.arch }})
        env:
          MNEMOVI_PROGRAMS: "--enable-ffmpeg --enable-ffprobe --disable-ffplay"
        run: |
          # --no-output-redirection: kit-next otherwise sends each lib's build
          # output to build.log, hiding the real error behind "<lib>: failed".
          # ffmpeg forbids gnutls+openssl together; our ffmpeg.sh patch makes
          # ffmpeg use gnutls and pass --disable-openssl (openssl still builds
          # because other --full libs depend on it). MnemoVi uses no TLS anyway.
          ./nix-macos.sh -p xcode26 --full ${{ matrix.disable }} --jobs=3 --no-output-redirection
          echo "OUT=$PWD/prebuilt/mnemovi-cli/${{ matrix.arch }}" >>"$GITHUB_ENV"

      - name: Upload build.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.arch }}
          path: build.log
          if-no-files-found: ignore

      - name: Verify — arch, LGPL, self-containment (hard fail)
        run: |
          set -euo pipefail
          for b in ffmpeg ffprobe; do
            F="$OUT/$b"
            test -x "$F" || { echo "::error::$b not produced"; exit 1; }
            lipo -archs "$F" | tr ' ' '\n' | grep -qx "${{ matrix.lipo }}" \
              || { echo "::error::$b is not ${{ matrix.lipo }}: $(lipo -archs "$F")"; exit 1; }
          done
          cfg="$("$OUT/ffmpeg" -hide_banner -version)"
          echo "$cfg"
          echo "$cfg" | grep -q -- "--enable-version3"        || { echo "::error::missing --enable-version3"; exit 1; }
          echo "$cfg" | grep -q -- "--enable-gpl"             && { echo "::error::GPL build detected"; exit 1; } || true
          echo "$cfg" | grep -Eq -- "--enable-(nonfree|libx264|libx265|libxvid|libvidstab)" \
            && { echo "::error::GPL/nonfree library present"; exit 1; } || true
          "$OUT/ffmpeg" -version 2>/dev/null | grep -qi "LGPL version 3" \
            || { echo "::error::license line is not LGPL version 3"; exit 1; }
          for b in ffmpeg ffprobe; do
            nonsys="$(otool -L "$OUT/$b" | tail -n +2 | awk '{print $1}' | grep -Ev '^/usr/lib/|^/System/' || true)"
            if [ -n "$nonsys" ]; then
              echo "::error::$b links non-system dylibs (not self-contained):"; echo "$nonsys"; exit 1
            fi
          done
          echo "LGPL + self-contained OK (${{ matrix.arch }})."

      - name: Stage arch-named release assets + provenance
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$OUT/ffmpeg"  "out/ffmpeg-${{ matrix.arch }}"
          cp "$OUT/ffprobe" "out/ffprobe-${{ matrix.arch }}"
          {
            echo "upstream: arthenica/ffmpeg-kit-next"
            echo "fork_ref: $GITHUB_SHA"
            echo "kit_next_version: $(git describe --tags --always)"
            echo "arch: ${{ matrix.arch }}   profile: xcode26   build: --full ${{ matrix.disable }}"
            echo "ffmpeg_version_line: $("$OUT/ffmpeg" -hide_banner -version | head -1)"
            shasum -a 256 "out/ffmpeg-${{ matrix.arch }}" "out/ffprobe-${{ matrix.arch }}"
          } | tee "out/PROVENANCE-${{ matrix.arch }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: mnemovi-ffmpeg-lgpl-macos-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

      - name: Publish Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            LGPL-3.0 ffmpeg/ffprobe CLI for MnemoVi (macOS arm64 + x86_64).
            Built from a fork of arthenica/ffmpeg-kit-next, `--full` (all non-GPL
            libraries), `--enable-version3`, no `--enable-gpl`. Assets are
            arch-suffixed (ffmpeg-aarch64 / ffmpeg-x86_64). This page is the LGPL
            source-availability offer.
